<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CO - Chấm Công</title>
  <meta name="description" content="Ứng dụng chấm công đơn giản, tính giờ làm việc theo tuần với target 44h.">
  <meta name="theme-color" content="#04060e" id="metaThemeColor">
  <!-- Gắn theme trước khi vẽ để không nháy (theme.js lo phần còn lại) -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('cico_theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'light') document.getElementById('metaThemeColor').setAttribute('content', '#c9d3fb');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/sky.css">
</head>
<body>
  <!-- ─── Nền trời động (theme.js dựng): sau nội dung + lớp vật bay trước nội dung ─── -->
  <div class="sky" id="sky" aria-hidden="true"></div>
  <div class="sky sky--front" id="skyFront" aria-hidden="true"></div>

  <div class="app">
    <!-- ─── Header: không khung, chỉ giờ + ngày + nút chuyển trên bầu trời ─── -->
    <header class="header">
      <h1 class="sr-only">CI/CO — Chấm Công Tuần</h1>
      <div class="header__time">
        <div class="header__clock" id="liveClock">--:--:--</div>
        <div class="header__date" id="liveDate">--</div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" role="switch" aria-checked="true" aria-label="Giao diện tối">
        <span class="theme-toggle__sky theme-toggle__sky--night"></span>
        <span class="theme-toggle__sky theme-toggle__sky--day"></span>
        <span class="theme-toggle__knob"></span>
      </button>
    </header>

    <!-- ─── Week Info ─── -->
    <section class="week-info" id="weekInfo">
      <span class="week-info__badge" id="weekNumber">Tuần --</span>
      <span class="week-info__range" id="weekRange">-- → --</span>
    </section>

    <!-- ─── KPI Alert Banner ─── -->
    <div class="kpi-alert-banner" id="kpiAlertBanner" style="display: none;"></div>

    <!-- ─── Summary Bar ─── -->
    <section class="summary" id="summarySection">
      <div class="summary__progress">
        <div class="summary__progress-track">
          <div class="summary__progress-fill" id="progressFill" style="width: 0%"></div>
          <div class="summary__progress-glow" id="progressGlow" style="width: 0%"></div>
        </div>
        <div class="summary__progress-labels">
          <span id="workedLabel">0h00m</span>
          <span id="targetLabel">44h00m</span>
        </div>
      </div>
      <div class="summary__cards">
        <div class="stat-card">
          <span class="stat-card__value" id="totalWorked">0h00m</span>
          <span class="stat-card__label">Đã làm</span>
        </div>
        <div class="stat-card stat-card--accent" id="remainingCard">
          <span class="stat-card__value" id="remaining">44h00m</span>
          <span class="stat-card__label">Còn lại</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__value" id="avgPerDay">0h00m</span>
          <span class="stat-card__label">Cần/ngày</span>
        </div>
        <div class="stat-card">
          <span class="stat-card__value" id="daysWorked">0/6</span>
          <span class="stat-card__label">Ngày đã log</span>
        </div>
      </div>
    </section>

    <!-- ─── Grid Toolbar ─── -->
    <div class="grid-toolbar" id="gridToolbar">
      <button class="fill-all-btn" id="fillAllBtn" type="button">⚡ Fill tất cả 8:00→17:30</button>
    </div>

    <!-- ─── Day Grid ─── -->
    <section class="day-grid" id="dayGrid"></section>

    <!-- ─── Report Chart ─── -->
    <section class="report">
      <h2 class="report__title">📊 Báo cáo tuần</h2>
      <div class="report__chart" id="reportChart"></div>
      <div class="report__burndown" id="burndownInfo"></div>
    </section>

    <!-- ─── Footer Stats ─── -->
    <footer class="app-footer app-footer--hidden" id="appFooter">
      <div class="footer-stats-content" id="footerStatsContent">
        <div class="footer-stat">
          <span class="footer-stat__dot footer-stat__dot--today"></span>
          <span class="footer-stat__label">Hôm nay</span>
          <span class="footer-stat__value" id="visitToday">--</span>
        </div>
        <div class="footer-stat">
          <span class="footer-stat__dot footer-stat__dot--month"></span>
          <span class="footer-stat__label">Tháng</span>
          <span class="footer-stat__value" id="visitMonth">--</span>
        </div>
        <div class="footer-stat">
          <span class="footer-stat__dot footer-stat__dot--total"></span>
          <span class="footer-stat__label">Tổng</span>
          <span class="footer-stat__value" id="visitTotal">--</span>
        </div>
      </div>
      <div class="footer-brand" id="footerBrand">CI/CO — Chấm Công Tuần</div>
    </footer>
  </div>

  <!-- ─── Modal ─── -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent">
      <div class="modal__header">
        <h2 class="modal__title" id="modalTitle">Nhập giờ</h2>
        <button class="modal__close" id="modalClose" type="button" aria-label="Đóng">&times;</button>
      </div>
      <div class="modal__body">
        <div class="modal__date-display" id="modalDate">--</div>
        <div class="form-row">
          <div class="form-group">
            <label for="inputCheckIn">Giờ vào</label>
            <input type="time" id="inputCheckIn" class="form-input" value="08:00">
          </div>
          <div class="form-group">
            <label for="inputCheckOut">Giờ ra</label>
            <input type="time" id="inputCheckOut" class="form-input" value="17:30">
          </div>
        </div>
        <div class="modal__preview" id="previewSection">
          <div class="preview__duration">
            <span class="preview__label">Thời gian làm:</span>
            <span class="preview__value" id="previewDuration">--</span>
          </div>
          <div class="preview__note" id="previewNote"></div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--danger" id="btnDelete" type="button">🗑 Xóa</button>
        <div class="modal__footer-right">
          <button class="btn btn--ghost" id="btnCancel" type="button">Hủy</button>
          <button class="btn btn--primary" id="btnSave" type="button">💾 Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Toast ─── -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/theme.js"></script>
  <script src="/app.js"></script>
</body>
</html>
